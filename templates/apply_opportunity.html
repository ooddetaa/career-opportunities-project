<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply to Opportunity</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="page-container form-page">

        <div class="form-card">
            <h1>Apply to Opportunity</h1>
            <p class="subtitle">
                You are applying for: <strong>{{ opportunity.title }}</strong> at <strong>{{ opportunity.company }}</strong>
            </p>

            <form method="POST" class="styled-form">
                <div class="form-group">
                    <label for="applicant_name">Full Name</label>
                    <input type="text" id="applicant_name" name="applicant_name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="applicant_email">Email</label>
                    <input type="email" id="applicant_email" name="applicant_email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="motivation">Motivation / Short Message</label>
                    <textarea id="motivation" name="motivation" rows="6" placeholder="Write a short message about why you are applying" required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Submit Application</button>
                    <a href="/" class="btn btn-secondary">Back to Home</a>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
